<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin Dashboard</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
		.container{max-width:800px;margin:40px auto;padding:0 16px}
		.card{background:#111827;padding:16px;border-radius:12px;margin-bottom:16px}
		input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;margin-top:10px}
		button{background:#2563eb;border:none;cursor:pointer}
		button:hover{background:#1d4ed8}
		table{width:100%;border-collapse:collapse}
		td,th{border-bottom:1px solid #334155;padding:8px}
	</style>
</head>
<body>
	<div class="container">
		<div class="card">
			<h2>Upload PDF</h2>
			<input type="file" id="file" accept="application/pdf" />
			<button onclick="upload()">Upload</button>
			<div id="msg"></div>
		</div>
		<div class="card">
			<h3>Documents</h3>
			<table><thead><tr><th>ID</th><th>Title</th><th>Type</th></tr></thead><tbody id="docs"></tbody></table>
		</div>
	</div>
	<script>
	const token = localStorage.getItem('token');
	if(!token || localStorage.getItem('role')!=='admin') location.href='/'
	async function upload(){
		const f = document.getElementById('file').files[0];
		if(!f){alert('Choose a PDF');return}
		const fd = new FormData(); fd.append('file', f);
		const res = await fetch('/api/admin/upload', {method:'POST', headers:{'Authorization':'Bearer '+token}, body: fd});
		const data = await res.json();
		document.getElementById('msg').textContent = JSON.stringify(data);
		loadDocs();
	}
	async function loadDocs(){
		const res = await fetch('/api/admin/documents', {headers:{'Authorization':'Bearer '+token}});
		const docs = await res.json();
		document.getElementById('docs').innerHTML = docs.map(d=>`<tr><td>${d.id}</td><td>${d.title}</td><td>${d.source_type}</td></tr>`).join('');
	}
	loadDocs();
	</script>
</body>
</html>
